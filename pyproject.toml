[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-executor"
version = "0.1.0"
description = "Structured document driven Django development pipeline"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Codex" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doc_executor" = ["agent_specs/*.md", "rule_packs/*.md"]

[tool.unittest]
testpaths = ["tests"]
